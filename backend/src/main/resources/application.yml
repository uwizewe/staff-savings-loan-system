spring:
  application:
    name: staff-finance-api
  datasource:
    url: jdbc:h2:file:./data/staff_finance;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
  h2:
    console:
      enabled: true
      path: /h2-console
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8091}
  error:
    include-message: never

app:
  frontend-url: ${FRONTEND_URL:http://localhost:8090}
  token-hours: ${TOKEN_HOURS:8}
  seed-demo: ${SEED_DEMO:true}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
