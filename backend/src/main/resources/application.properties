spring.application.name=staff-finance-api

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/staff_finance?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Africa/Kigali
spring.datasource.username=root
spring.datasource.password=Root@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Jackson
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false

# Server
server.port=${SERVER_PORT:8092}
server.error.include-message=never

# Application settings
app.frontend-url=${FRONTEND_URL:http://localhost:8090}
app.token-hours=${TOKEN_HOURS:8}
app.seed-demo=${SEED_DEMO:true}

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha